name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.0
          name: "Zara AI Assistant v5.1.0 — SuperX Capsule 2.0 & Intelligent App Launch Repair"
          body: |
            ### Zara AI Assistant v5.1.0 (Release Build 510)
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v5.1.0:
            - **Intelligent Native Android App Launching**:
              - Fixed "Open Instagram" and "Open ChatGPT" opening in Chrome browser!
              - Resolved phonetic domain hijacking in `CommandParser.kt`. Only explicit website queries open in Chrome.
              - Native package launcher for Instagram, ChatGPT, WhatsApp, YouTube, Spotify, Settings, Camera, Gallery, and Chrome with Android 11+ `<queries>` package visibility compliance.
              - Missing application handling: Gracefully alerts user when an app is not installed instead of silently opening Chrome.
            - **SuperX Capsule 2.0 (Premium Transformation)**:
              - Dynamic Island-inspired interaction with 60 FPS spring animations.
              - Cute AI Companion expressions: Blinking animated eyes, breathing, thinking neural orbit, audio-reactive waveform mouth, celebratory (^ ^) face, and gentle error shake.
              - Interactive expansion: Tap capsule to expand into SuperX Dashboard with live transcripts, music controls, battery % + charging status, and time.
            - **Critical Voice Engine & State Machine Repair**:
              - Fixed "Zara only says 'I'm here'" / wake word loop by replacing long greeting speech with immediate wake chime, instantly opening the microphone for user commands.
              - Fixed Gemini Live VAD deadlocks: Conformed to official BidiGenerateContent `activityStart` and `activityEnd` signals.
              - Structured error classification: Internet unavailable, AI authentication failed, API quota exceeded, AI server unavailable.
            - **Dedicated Voice Diagnostics Screen**:
              - Live status dashboard for Mic permission, Hardware, Vosk, Gemini Live, WebSocket latency, and structured telemetry logs.
              - One-tap "Test Connection & Retry" trigger.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
