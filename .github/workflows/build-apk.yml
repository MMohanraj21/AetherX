name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.4.0
          name: "Zara AI Assistant v5.4.0 — Complete UI/UX Redesign (ChatGPT + Gemini Hybrid)"
          body: |
            ### Zara AI Assistant v5.4.0 (Release Build 540)
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v5.4.0:
            - **ChatGPT + Gemini Hybrid UI/UX Architecture**:
              - Pure OLED Dark Theme (`#090A0F`, `#12131A`, `#181924`) with Electric Purple brand accents (`#A855F7`) and Gemini Sapphire reflections (`#38BDF8`).
              - Minimalist Home Canvas with personalized greeting, suggestion prompt chips (*Analyze Screen*, *Play Music*, *Send WhatsApp*, *Daily Briefing*, *Device Control*).
              - Sleek floating composer dock with multiline input, attachment picker, camera vision trigger, and dedicated Live Voice Mode button.
            - **Sidebar Navigation Drawer**:
              - New Chat, Search chats, Pinned & Recent conversations, Semantic Memories v4 shortcut, Explore AI Tools shortcut, Automations, Settings, and Mohanraj Verified Founder profile footer.
            - **Dedicated Immersive Voice Mode (`VoiceModeActivity`)**:
              - Fluid audio-reactive living waveform and continuous conversation state machine.
              - Live subtitles/transcript card, mic mute toggle, interrupt button, and strict voice lock display (`Aoede (F)` / `Puck (M)`).
              - Continuous session runs non-disruptively in background foreground service without termination on navigation.
            - **Explore AI Tools Catalog (32 Actions)**:
              - Full directory organizing all 32 backend actions across 12 intuitive categories with "Try This" prompt pills.
            - **Vivo Origin Island & Hardware Guarantees**:
              - Native punch-hole integration on Vivo T5 Pro / OriginOS 6 (`NOTIFICATION_ID = 41`).
              - 100% preservation of all 32 tools, Gemini Live WebSocket, and single voice arbiter.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
