name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.0
          name: "Zara AI Assistant v5.3.0 — Double Voice Fix & Intelligent Single Confirmation System"
          body: |
            ### Zara AI Assistant v5.3.0 (Release Build 530)
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v5.3.0:
            - **Single Voice Output Architecture (Double Voice Completely Fixed)**:
              - Full audit of all audio output engines (Gemini Live Audio vs Android TextToSpeech).
              - Authoritative Speech Arbiter (`voiceOutputLock`): When Gemini Live streams generated audio, secondary Android TTS reading of the transcript is suppressed.
              - When Gemini returns text only (REST fallback `GeminiRestClient`), the configured Zara TTS speaks authoritatively without late streaming audio collision.
              - Immediate barge-in & interruption: Flushes both AudioTrack and TTS instantly when user speaks.
              - Preserves existing Zara voice identity, pitch, and timbre.
            - **Intelligent Single Confirmation System**:
              - Eliminates repeated confirmation questions ("Send pannava?", "Send pannattuma?", "Should I send it?", "Are you sure?").
              - Unified `IntelligentConfirmationManager` with Risk-Based Confirmation Policy:
                - **Category A (No Confirmation Needed)**: Open Instagram, Open ChatGPT, Open YouTube, Tell time, Check battery, Music controls execute immediately in < 50ms.
                - **Category B (Single Confirmation)**: WhatsApp messages, Notification replies, SMS ask EXACTLY ONCE ("Rahul-kku WhatsApp message send pannava?"). User says "Yes" -> executes once immediately ("Message sent successfully."). User says "No" -> cancels immediately ("Okay, message cancelled.").
                - **Category C (Strong Confirmation)**: Sensitive and destructive actions safeguarded with explicit authorization.
            - **Duplicate Execution Protection**:
              - Unique request IDs, action IDs, single-use authentication tokens.
              - Idempotency filter with 30s TTL prevents duplicate messages from duplicate tool callbacks or retries.
            - **Acceptance Test Suite**:
              - Verified with automated acceptance tests covering all 10 voice and confirmation scenarios.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
