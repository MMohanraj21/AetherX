name: Build & Release AETHER X APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package AETHER X APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Python Backend Tests
        run: |
          python3 -m pip install -r backend/requirements.txt || true
          python3 backend/tests/run_all_tests.py

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (Main Branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "AETHER X v2.0.0 — Production Release"
          body: |
            ### AETHER X — Next-Gen Android AI Assistant
            - **Hybrid AI Core**: Google Gemini Live Bidirectional WebSocket (PCM 16k in / 24k out) + OpenAI fallback.
            - **Multimodal Intelligence**: Fashion analysis, travel landmark recognition, document OCR.
            - **Human-in-the-Loop Security**: `ActionGatekeeper` prevents unconfirmed calls or messages.
            - **Keystore Encryption**: AES-256-GCM hardware protection for API credentials.
            - **Cyberpunk UI**: Jetpack Compose holographic HUD with reactive quantum orb.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
