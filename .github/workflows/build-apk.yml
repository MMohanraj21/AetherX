name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.5.0
          name: "Zara AI Assistant v5.5.0 — Master Stability Fix (Notification Stability & Strict Voice Lock)"
          body: |
            ### Zara AI Assistant v5.5.0 (Release Build 550)
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v5.5.0:
            - **Notification Stability & Zero Service Interruptions (OFF/ON Bug Completely Fixed)**:
              - Full root cause elimination of service auto-restart when phone notifications arrive.
              - Unified `ZaraNotificationManager`: Single notification ID 41, single silent channel (`zara_live_service`), separation of `startForeground` vs `notify`.
              - Resilient `AudioRecorder`: Handles audio focus ducking from notification chimes without tearing down or recreating `AudioRecord`. Comfort silence preserves Gemini Live stream continuity.
              - Silent `NotificationEventManager`: Incoming notifications from WhatsApp/SMS are indexed silently into `NotificationRepository` without triggering unprompted speech or session state flips.
              - Full Vivo Origin Island (OriginOS 6) & Android 16 Promoted Ongoing notification compliance.
            - **Strict Voice Lock (`ZaraVoicePreferenceManager`)**:
              - Male selected = Male only. Female selected = Female only.
              - Absolute prohibition of automatic or cross-gender fallback across Gemini Live & Android TTS.
              - Strict voice filtering (`findStrictFemaleVoice` / `findStrictMaleVoice`) + acoustic formant pitch modulation (1.08f / 0.90f).
            - **Single Speech Output Controller (`ZaraSpeechOutputController`)**:
              - Single speech arbiter guaranteeing zero voice overlap between Gemini Live audio and Android TTS.
              - Automatically returns conversation state to `LISTENING` upon speech completion.
            - **Continuous Conversation Protection**:
              - Unbroken flow: `LISTENING -> PROCESSING -> SPEAKING -> LISTENING`.
              - Microphone remains active indefinitely until explicit user verbal STOP command.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
