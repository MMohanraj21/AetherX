name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.0
          name: "Zara AI Assistant v5.6.0 — Premium Human-like Tamil AI Voice System"
          body: |
            ### Zara AI Assistant v5.6.0 (Release Build 560)
            Founder & Lead Architect: Mohanraj (@Hexvora777).
            Official Connections:
            - GitHub: https://github.com/Hexvora777
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "From Tamil Soil to a World of Possibilities."

            ### What's New in v5.6.0:
            - **Premium AI Voice Library (Exactly 10 Options)**:
              - **5 Female AI Voices**: `Sulafat` (Warm, sweet & pleasant), `Achernar` (Soft, gentle & soothing), `Aoede` (Breezy & conversational), `Vindemiatrix` (Gentle & calm), `Zephyr` (Bright & clear).
              - **5 Male AI Voices**: `Algieba` (Smooth & refined), `Achird` (Friendly & conversational), `Charon` (Clear & informative), `Umbriel` (Relaxed & easy-going), `Puck` (Energetic & upbeat).
              - Verified Google Gemini Live neural voice identifiers (24kHz 16-bit PCM). Default female voice: `Sulafat`; default male voice: `Algieba`.
            - **COMPLETE REMOVAL OF ANDROID TEXT-TO-SPEECH (TTS)**:
              - Android TextToSpeech (`android.speech.tts.TextToSpeech`) completely and permanently purged from the application.
              - ZERO robotic TTS voices. All conversational speech is generated 100% natively via Gemini Live WebSocket neural audio.
            - **Advanced Tamil Voice Experience (`ta-IN`)**:
              - Authentic spoken conversational Tamil (பேச்சுத் தமிழ்) as naturally spoken in Tamil Nadu.
              - Elimination of stiff, archaic, bookish written Tamil.
              - Natural human cadence, expressive emotional intonation (warmth, empathy, wit), and natural sentence pauses.
              - Smooth, natural code-switching / Tanglish fluency for modern tech terms.
            - **Futuristic OLED Voice Studio (`VoiceStudioActivity`)**:
              - Pure OLED dark theme (`#08080C`, glassmorphic cards, sapphire/purple accents).
              - Separate Female and Male voice tabs.
              - 10 Voice Cards with personality descriptions, active voice indicators, and one-tap voice lock.
              - Real-time native audition player previewing authentic Tamil audio (*"வணக்கம்! நான் Zara. எப்படி இருக்கீங்க? ಇಂದು உங்களுக்கு என்ன உதவி செய்யட்டும்? உங்களுடன் பேசுவதில் எனக்கு மகிழ்ச்சி."*).
            - **Strict Voice Lock & Continuous Conversation**:
              - Absolute gender lock (Male selected = Male only; Female selected = Female only). Zero cross-gender fallback.
              - Unbroken conversational loop (`IDLE -> LISTENING -> PROCESSING -> SPEAKING -> LISTENING`).
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
