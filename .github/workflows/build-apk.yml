name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.1
          name: "Zara AI Assistant v5.0.1 — Speech Recognition, Live Conversation & Lifecycle Stability Repair"
          body: |
            ### Zara AI Assistant v5.0.1 (Release Build 501)
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v5.0.1 (Complete Voice & Speech Recognition Repair):
            - **Fixed 'Spoken user query' Placeholder**:
              - Enabled `inputAudioTranscription: {}` in Gemini Live setup to stream real user speech transcription.
              - Saved and displayed exact recognized Tamil/Tanglish/English transcripts in chat history.
            - **Fixed MainActivity Opening Interruption**:
              - Protected active voice conversations during Activity `onResume()`. Opening/minimizing the app no longer kills voice sessions.
            - **Eliminated Stuck in Listening & Thinking**:
              - Dispatched `audioStreamEnd` upon adaptive silence detection so Gemini immediately starts generating replies without waiting for server timeouts.
              - Standardized camelCase payloads (`systemInstruction`, `generationConfig`, `toolResponse`, `clientContent`) for Gemini Live WebSocket.
            - **Natural Tamil, Tanglish & Multi-Turn Intelligence**:
              - Native spoken Tamil/Tanglish comprehension without keyword truncation.
              - Full contextual discourse tracking for follow-ups ("Appo yen...", "Give me an example").
            - **Voice Pipeline Diagnostics (`VoicePipelineDiagnostics`)**:
              - Stage-by-stage latency and failure monitoring across the entire voice pipeline.
              - 850ms dynamic continuation pause for complex sentences and Tamil/Tanglish clauses ("anal", "appuram").
            - **True Voice Barge-In & Interruption Protection**:
              - Atomic turn epochs and instantaneous hardware `AudioTrack` flush upon user speech.
              - Complete prevention of old audio bleed via server turn abort.
            - **Context-Aware Smart Confirmation Gate (`MessageExecutionGate`)**:
              - Strict verbal confirmation token bound to recipient and content hash. Zero auto-send bypasses.
            - **Dynamic Context Retention**:
              - Automatic multi-turn conversation and entity re-injection on WebSocket reconnects.
            - **Unwanted Ghost Bubble Completely Removed**:
              - Deactivated `TaskProgressOverlay` and stripped `SYSTEM_ALERT_WINDOW`.
              - Zero floating bubble on the right side of the screen; pure native Vivo Origin Island SuperX status capsule at the top.
            - **Continuous Conversation Engine & Audio Lifecycle Fix**:
              - Fixed session termination after single-sentence commands; microphone remains active in `LISTENING` mode for natural follow-up speech.
              - Replaced aggressive 2s background timeout with 15s natural dialogue window.
              - Eliminated repetitive greeting injection ("Please tell me from the beginning / I am learning").
            - **Smart Notification Intelligence**:
              - Privacy filtering (excluding OTPs, passwords, bank transactions).
              - Vocal announcement of incoming messages and contextual reply suggestions.
              - Official Android RemoteInput reply execution with vocal confirmation.
            - **Smart Call Announcement & Authorized Control**:
              - Real-time telephony state tracking and caller contact resolution.
              - Hands-free voice answering and declining in English, Tamil, and Tanglish.
            - **Next-Gen AI Modules & Central AI Orchestrator**:
              - Screen Intelligence, Autonomous Task Agent with safety gates, Offline AI Mode, Advanced Personal Memory v4, Smart Automation Modes, Live Language Translator, Universal Media Controller, AI Privacy Guardian, Emergency SOS Assistant, and Daily Briefing Engine.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
