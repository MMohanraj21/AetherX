name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2.0
          name: "Zara AI Assistant v5.2.0 — Critical Voice Response Repair & Vivo Origin Island Integration"
          body: |
            ### Zara AI Assistant v5.2.0 (Release Build 520)
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v5.2.0:
            - **Critical Voice Response Failure Repair**:
              - Complete trace audit: Wake Word → Microphone → Audio Capture → Speech Recognition → Transcript → AI Request → Gemini Live/REST → Response Reception → TTS.
              - Zero deadlock guarantee: Completely eliminated stuck in LISTENING or THINKING states.
              - Gemini Live Protocol: Defaulted to active `gemini-3.8-live` and removed invalid `thinkingBudget: 0`.
              - Local Offline Speech Recognition via Vosk: Real-time speech transcription directly from captured PCM audio bytes.
              - Ultra-Fast Local Intent Dispatch: Device commands (Flashlight, Volume, Time, Media, App launches) execute in < 50ms locally without waiting for remote servers.
              - High-Reliability Gemini REST Fallback (`GeminiRestClient`): 6-second watchdog automatic failover for generative AI queries.
              - Actual Speech Transcript Display: Shows recognized words in real-time, eliminating "Spoken user query" placeholder.
              - Multi-Language Understanding: English, Tamil, and Tanglish.
              - Eliminated wake-word loop: "I'm here" strictly serves as wake acknowledgment, never substituting for command execution.
            - **Native Vivo Origin Island Integration (Strictly Native, NO Floating Capsules)**:
              - Zero floating overlay windows or WindowManager attachments.
              - Promoted Ongoing Notification (ID 41) directly on the active microphone foreground service.
              - Voice assistant live status indicators: READY, LISTENING, THINKING, SPEAKING.
              - Android MediaStyle music controls: Title, artist, play/pause, next, previous.
              - Quick Info: Real-time battery percentage and charging status.
              - Smart notifications: Task completion, execution status, connection alerts.
            - **Voice Diagnostics & Acceptance Suite**:
              - Telemetry metrics: Microphone, Vosk, Gemini Live, Gemini REST, Latency, Error Logs.
              - 20-command consecutive voice test suite.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
