name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "Zara AI Assistant v2.4 — Origin Island & Universal Typing (By Mohanraj)"
          body: |
            ### Zara AI Assistant v2.4
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Telegram: https://t.me/Hexvora777
            Instagram: https://instagram.com/Hexvora777

            ### What's New in v2.4:
            - **Origin Island Integration**: Apple Dynamic Island & Vivo Origin Island inspired floating pill interface with real-time waveform, thinking orbit, media controls, and notification cards.
            - **Universal Typing with Gboard**: Dictate text directly into focused fields across WhatsApp, ChatGPT, Chrome, Instagram, Telegram, Gmail, and Google Docs while keeping Gboard untouched.
            - **Interruptible Voice & Barge-In**: Real-time voice interruption over loudspeaker and headphones with immediate task and TTS cancellation.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
