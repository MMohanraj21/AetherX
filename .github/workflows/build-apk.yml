name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: "Zara AI Assistant v2.5 — Smart Native Island & App-Independent Wake Word"
          body: |
            ### Zara AI Assistant v2.5
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777

            ### What's New in v2.5:
            - **Smart Native Island Detection & Integration**:
              - Automated OEM hardware, model, and firmware inspection (Vivo OriginOS, Oppo Aqua Dynamics, Honor MagicOS Smart Capsule).
              - Native system punch-hole live activity integration for supported devices.
              - **Strict Zero-Fake-Island Rule**: Completely disables simulated overlays and floating popups when native system island is unsupported.
            - **App-Independent Background Wake Word ("Hey ZARA")**:
              - Hands-free on-device offline wake word detection running via persistent foreground microphone service.
              - Seamless activation across Android Home Screen, third-party apps (WhatsApp, Chrome, ChatGPT, YouTube), and Lock Screen.
              - Zero audio streamed to cloud until wake word triggers. Immediate hands-free conversation launch.
            - **Permanent Creator Identity Protocol**:
              - 100% verified sole creator identity: Mohanraj (@Hexvora777).
              - Complete eradication of legacy branding across notifications, layouts, and service dialogs.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
