name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg = img.resize((fw, fh), Image.Resampling.LANCZOS)
              fg.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.0
          name: "Zara AI Assistant v2.7.0 — Single-Sentence Wake Word & Hands-Free Background Assistant"
          body: |
            ### Zara AI Assistant v2.7.0
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777

            ### What's New in v2.7.0:
            - **Single-Sentence Wake Word + Command Execution**:
              - Say wake phrase and command together in one continuous sentence without pausing or waiting for re-prompts:
                - *"Hey ZARA, Open WhatsApp."*
                - *"ZARA, Open YouTube."*
                - *"Hey ZARA, Turn on Flashlight."*
                - *"ZARA, Take me to Chennai."*
                - *"WhatsApp open pannu"*, *"YouTube ah open pannu"*.
              - Thread-safe 3000ms circular PCM AudioRingBuffer preserves post-wake audio context.
            - **True Hands-Free Background Assistant**:
              - ZARA operates seamlessly in the background without automatically taking over the screen or popping up MainActivity.
              - When inside WhatsApp, Chrome, ChatGPT, or on the home screen, commands execute directly in the background.
              - MainActivity is ONLY brought to the front if the user explicitly says *"Open ZARA"*.
            - **Immediate Voice Response & Feedback**:
              - Low-latency voice confirmations via TTS: *"Opening WhatsApp."*, *"Flashlight turned on."*, *"Navigating to Chennai."*
              - Standalone wake greeting: responds with *"Yes, I'm listening."* immediately when called alone.
            - **Full Indian Language & Vernacular App Control**:
              - English, Tamil, Tanglish, Hinglish, and Telugu support for app launching, volume, brightness, and flashlight controls.
            - **Google Maps Integration**:
              - Dedicated GoogleMapsManager supporting turn-by-turn navigation (*"Chennai ku vazhi kaatu"*, *"Navigate to airport"*) and nearby place searches (*"Find nearest petrol bunk"*, *"Search nearby restaurants"*).
              - Native Maps intent targeting with universal browser fallback.
            - **14-Category Persistent Long-Term Memory (Room SQLite)**:
              - 14 Structured categories: UserProfile, Preferences, Education, Career, Projects, Goals, Relationships, TechPreferences, Plans, Events, RecurringTasks, Summaries, Corrections, Context.
              - Automatic background memory extraction from user conversation turns.
              - Gemini Live tools `manage_memory` and `manage_maps` declared and wired for full conversational memory persistence.
            - **Voice Barge-In Audio Interruption**:
              - Immediate TTS and playback cutoff when user speech is detected during voice output.
            - **System Diagnostics & Telemetry**:
              - Standardized logging tags implemented across voice, execution, memory, and lifecycle pipelines.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
