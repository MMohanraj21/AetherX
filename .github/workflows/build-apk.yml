name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')
          img.save('app/src/main/res/drawable/zara_master_logo.png', 'PNG')
          img.save('app/src/main/res/drawable/ic_zara_logo.png', 'PNG')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg_canvas = Image.new('RGBA', (fw, fh), (0, 0, 0, 0))
              fg_w, fg_h = int(fw * 0.78), int(fh * 0.78)
              resized = img.resize((fg_w, fg_h), Image.Resampling.LANCZOS)
              offset_x = (fw - fg_w) // 2
              offset_y = (fh - fg_h) // 2
              fg_canvas.paste(resized, (offset_x, offset_y), resized)
              fg_canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons and drawables generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.5.1
          name: "Zara AI Assistant v5.5.1 — Conversation State Machine & Creator Identity Release"
          body: |
            ### Zara AI Assistant v5.5.1 (Release Build 551)
            Founder & Lead Architect: Mohanraj (@Hexvora777).
            Official Connections:
            - GitHub: https://github.com/Hexvora777
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v5.5.1:
            - **Authoritative Conversation State Machine (`ZaraConversationStateMachine`)**:
              - Complete elimination of rapid `LISTENING ↔ SPEAKING` switching and UI flickering.
              - Authoritative state machine with `SessionId`, `TurnId`, and strict state validation.
              - Unbroken conversational lifecycle: `IDLE -> LISTENING -> PROCESSING -> SPEAKING -> LISTENING`.
              - Zero premature timeouts in `AudioPlayer`: tolerate network chunk delivery gaps up to 3000ms.
              - Resilient near-field voice barge-in with loudspeaker echo rejection (0.45f threshold, 200ms sustained human speech filter).
            - **Global Strict Voice Lock Synchronization**:
              - Male selected = Male only. Female selected = Female only.
              - Unified `voice` and `voiceGender` mutual synchronization in `AppPreferences` and `PersonaActivity`.
              - Enhanced TTS voice filtering with explicit gender feature inspection and acoustic pitch locking (1.18f / 0.85f).
              - Default voice synchronized to "Aoede" (Warm Female).
            - **Full Creator Identity Dossier & Natural Multi-lingual Introductions**:
              - Complete, rich creator introduction for "Who created you?", "Who is your developer?", "Who is Mohanraj?", "Tell me about your creator", and "உன்னை யார் உருவாக்கினார்கள்?".
              - Detailed creator profile covering Mohanraj, BE CSE education, Pudukkottai hometown, proud Tamil roots, and his mission as Founder & Lead Architect of ZARA AI.
              - 4–6 sentence minimum for simple inquiries, and full multi-paragraph dossier for detailed questions in English, Tamil, and Tanglish.
              - Expanded REST client generation token budget to 1200 tokens.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
