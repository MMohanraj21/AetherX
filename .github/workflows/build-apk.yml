name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg = img.resize((fw, fh), Image.Resampling.LANCZOS)
              fg.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0
          name: "Zara AI Assistant v2.6.0 — Permanent Wake Word & Smart Personal Organizer"
          body: |
            ### Zara AI Assistant v2.6.0
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777

            ### What's New in v2.6.0:
            - **Official ZARA AI Identity & Branding**:
              - Brand new high-resolution glowing neon cyber logo.
              - 100% complete eradication of legacy "Jarvis" naming across all UI screens, toasts, dialogs, overlays, and notifications.
              - **Permanent Creator Recognition Protocol**: Unconditionally identifies Mohanraj (@Hexvora777) as the sole creator and developer in Tamil, English, Hindi, and all languages.
            - **Default Digital Assistant Integration**:
              - System-level Android VoiceInteractionService integration.
              - Select Zara as your default Digital Assistant in Android Settings (long-press Home / swipe from corner launches Zara instantly).
              - Dedicated 1-tap Assistant setup row in Settings.
            - **Permanent Wake Word Persistence & Auto-Shutdown Fix**:
              - Fixed background activation failure: Standby Vosk wake-word listening cleanly re-arms after speech turns.
              - App-independent wake word: `isWakeWordEnabled` is persistent and never resets when opening app or switching screens.
              - OEM Autostart & background power management guidance for Vivo, Xiaomi & Samsung.
            - **Smart Personal Organizer & Utilities Core**:
              - **Smart Alarm System**: Create, edit, delete, and relative-time alarms hands-free.
              - **Smart Notes Engine**: Persistent Room database storage (`zara_notes`) with categories, auto-save, search, and voice readback.
              - **Smart Reminders**: Exact time scheduling via `AlarmManager.setExactAndAllowWhileIdle` with high-priority heads-up notifications.
              - **Timers & Stopwatch**: Hands-free countdown timers.
              - **Smart Calendar**: Event scheduling via `CalendarContract`.
              - **Tasks & To-Dos**: High/Medium/Low priority task tracking.
              - **Daily Briefing**: Natural spoken daily overview in Tamil, English, and Tanglish.
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
