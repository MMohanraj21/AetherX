name: Build & Release Zara Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Zara APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate App Launcher Icons from Master Logo
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          src = 'app/src/main/res/drawable/zara_master_logo.png'
          if not os.path.exists(src):
              print('Source logo not found!')
              exit(0)

          img = Image.open(src).convert('RGBA')

          densities = {
              'mipmap-mdpi': (48, 48, 108, 108),
              'mipmap-hdpi': (72, 72, 162, 162),
              'mipmap-xhdpi': (96, 96, 216, 216),
              'mipmap-xxhdpi': (144, 144, 324, 324),
              'mipmap-xxxhdpi': (192, 192, 432, 432),
          }

          for folder, (w, h, fw, fh) in densities.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              
              icon = img.resize((w, h), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              icon.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              
              fg = img.resize((fw, fh), Image.Resampling.LANCZOS)
              fg.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          print('Launcher icons generated successfully across all densities!')
          "

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Zara-release.apk
          cp app/build/outputs/apk/debug/*.apk artifacts/Zara-debug.apk

      - name: Upload Zara Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-release
          path: artifacts/Zara-release.apk

      - name: Upload Zara Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-debug
          path: artifacts/Zara-debug.apk

      - name: Create GitHub Release (Zara Assistant)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "Zara AI Assistant v3.0.0 — Next-Generation Hands-Free Personal AI Assistant"
          body: |
            ### Zara AI Assistant v3.0.0 (Release Build 300)
            Architected, Designed & Developed exclusively by Mohanraj (@Hexvora777).
            Official Connections:
            - Telegram: https://t.me/Hexvora777
            - Instagram: https://instagram.com/Hexvora777
            - Motto: "Every identity has an origin. Mine is Mohanraj."

            ### What's New in v3.0.0:
            - **Phase B — Zero-Loss Single-Sentence Audio & Handover**:
              - Seamless handover between Vosk standby and Gemini Live so single-sentence queries (e.g. *"Hey ZARA, what is quantum computing?"*) stream post-wake audio chunks directly without requiring the user to repeat the command.
              - Intelligent wake handling: standalone wake phrases receive *"Yes, I'm listening."*, while single-sentence commands transition directly to execution without redundant interruptions.
            - **Phase C — Four-Layer Persistent Memory Architecture (Room SQLite)**:
              - **Layer A (Immediate Context)**: Sliding in-memory window of active dialogue turns.
              - **Layer B (Long-Term Memory)**: Expanded `MemoryEntity` across 14 categories with importance, confidence, lastUpdated, and isOutdated flags.
              - **Layer C (Conversation Archive)**: Relational `ConversationEntity`, `MessageEntity`, and `ConversationSummaryEntity` for full-text searchable history.
              - **Layer D (Active Task Context)**: `TaskContextEntity` preserving active workflows and project discussions across app restarts.
              - **Safe Database Migrations**: Implemented non-destructive `MIGRATION_1_2` in `MemoryDatabase` preventing data wipe on upgrade.
              - Automatic migration of legacy SharedPreferences chat turns into relational SQLite tables.
              - `MemoryRetriever`: Multi-tier contextual prompt synthesis before answering questions.
            - **Phase D — Google Calendar & Daily Briefing Deep Integration**:
              - Added `READ_CALENDAR` and `WRITE_CALENDAR` permissions.
              - ContentResolver queries for today's agenda, date ranges, and conflict detection (`CalendarManager`).
              - `DailyBriefingManager` integrates today's live calendar events into spoken briefings in Tamil, English, and Tanglish.
              - Gemini Live `manage_calendar` tool expanded for listing events, creating meetings, and checking schedule conflicts.
            - **Phase E — Memory Dashboard Overhaul**:
              - Dynamic horizontal category filter chips supporting all 14 categories (`UserProfile`, `Preferences`, `Education`, `Career`, `Projects`, `Goals`, `Relationships`, `TechPreferences`, `Plans`, `Events`, `RecurringTasks`, `Summaries`, `Corrections`, `Context`).
              - Direct JSON export control for backing up and reviewing stored memories.
            - **Phase F — Autonomous Multi-Step Travel & Task Planning**:
              - Autonomous trip organizer (`TravelPlanningManager`): destination extraction, date/time parsing, calendar conflict checking, Google Maps route preparation, and spoken proposal generation.
              - Voice command parsing for trip planning in English, Tamil, and Tanglish (*"plan my trip to Hosur tomorrow"*, *"Hosur ku trip plan pannu"*).
          files: |
            artifacts/Zara-release.apk
            artifacts/Zara-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
